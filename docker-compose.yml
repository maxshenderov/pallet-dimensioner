services:
  pallet-dimensioner:
    build: .
    container_name: pallet-dimensioner
    ports:
      - "${SERVER_PORT:-8012}:8012"
    devices:
      - "${CAMERA_TOP_DEVICE:-/dev/video0}:/dev/video0"
      - "${CAMERA_SIDE_DEVICE:-/dev/video1}:/dev/video1"
    volumes:
      - ./config:/app/config
      # Единственное, что обязано пережить пересборку образа: настройки точек, база замеров
      # и обученных поправок (pallet.db), intrinsics камер, очередь неотправленных событий.
      # Bind mount, а не именованный том, — чтобы бэкап был обычным копированием каталога.
      - "${DATA_DIR:-./data}:/app/data"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
